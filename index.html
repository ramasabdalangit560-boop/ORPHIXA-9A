<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORPHIXA 9A - Galeri Foto</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #38bdf8; }
        .upload-box { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
        input[type="text"], input[type="file"] { background: #334155; color: white; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 30px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .card { background: #1e293b; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
        .card p { font-size: 14px; margin: 5px 0; word-break: break-word; }
        .delete-btn { background: #ef4444; font-size: 12px; padding: 5px; width: 100%; margin-top: 5px; }
        .delete-btn:hover { background: #dc2626; }
        #counter { font-weight: bold; color: #fbbf24; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>ORPHIXA 9A Gallery</h1>
    <p>Koleksi foto kenangan kelas 9A</p>

    <div class="upload-box">
        <div id="counter">Memuat jumlah foto...</div>
        <input type="text" id="uploaderName" placeholder="Nama Kamu...">
        <input type="file" id="imageFile" accept="image/*">
        <button id="uploadBtn" onclick="uploadFoto()">Kirim Foto</button>
    </div>

    <div class="gallery" id="galleryContainer"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // Masukkan Konfigurasi Firebase Kamu di Sini
        const firebaseConfig = {
            apiKey: "MASUKKAN_FIREBASE_API_KEY_KAMU",
            authDomain: "evrestweb.firebaseapp.com",
            projectId: "evrestweb",
            storageBucket: "evrestweb.appspot.com",
            messagingSenderId: "MASUKKAN_SENDER_ID",
            appId: "MASUKKAN_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ImgBB API Key Kamu yang sudah disalin
        const IMGBB_API_KEY = "522836257e7664d7c348579188fc5080";

        let totalFotoCount = 0;

        // Ambil data foto secara real-time dari Firestore
        db.collection("galeri_kelas").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            const container = document.getElementById("galleryContainer");
            container.innerHTML = "";
            totalFotoCount = snapshot.size;
            
            document.getElementById("counter").innerText = `Total Foto: ${totalFotoCount} / 50`;

            if (totalFotoCount >= 50) {
                document.getElementById("uploadBtn").disabled = true;
                document.getElementById("uploadBtn").innerText = "Kapasitas Penuh (50/50)";
            } else {
                document.getElementById("uploadBtn").disabled = false;
                document.getElementById("uploadBtn").innerText = "Kirim Foto";
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto Kelas">
                    <p><b>${escapeHtml(data.name)}</b></p>
                    <button class="delete-btn" onclick="hapusFoto('${doc.id}')">Hapus</button>
                `;
                container.appendChild(card);
            });
        });

        // Fungsi Upload Foto ke ImgBB & Firestore
        async function uploadFoto() {
            if (totalFotoCount >= 50) {
                alert("Maaf, galeri sudah mencapai batas maksimal 50 foto!");
                return;
            }

            const nameInput = document.getElementById("uploaderName").value.trim();
            const fileInput = document.getElementById("imageFile").files[0];
            const btn = document.getElementById("uploadBtn");

            if (!nameInput || !fileInput) {
                alert("Mohon isi nama dan pilih foto terlebih dahulu!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Mengunggah...";

            try {
                // 1. Upload file gambar ke ImgBB pakai API Key kamu
                const formData = new FormData();
                formData.append("image", fileInput);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const result = await response.json();

                if (!result.success) {
                    throw new Error("Gagal mengunggah gambar ke server ImgBB.");
                }

                const imageUrl = result.data.url;

                // 2. Simpan link gambar & nama pengirim ke Firestore
                await db.collection("galeri_kelas").add({
                    name: nameInput,
                    imageUrl: imageUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Reset form
                document.getElementById("uploaderName").value = "";
                document.getElementById("imageFile").value = "";
                alert("Foto berhasil diunggah!");

            } catch (error) {
                alert("Terjadi kesalahan: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Kirim Foto";
            }
        }

        // Fungsi Hapus Foto
        async function hapusFoto(id) {
            if (confirm("Yakin ingin menghapus foto ini?")) {
                try {
                    await db.collection("galeri_kelas").doc(id).delete();
                } catch (error) {
                    alert("Gagal menghapus foto: " + error.message);
                }
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
